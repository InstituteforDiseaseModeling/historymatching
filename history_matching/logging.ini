[loggers]
keys=root,history_matching

[handlers]
keys=debugLogHandler,consoleHandler,debugConsoleHandler,Null

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=Null

[logger_history_matching]
level=DEBUG
# level=INFO
handlers=consoleHandler,debugLogHandler
qualname=history_matching
propagate=0

[handler_debugLogHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('historyMatching.log', 'w')

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_Null]
class=logging.NullHandler
level=NOTSET
args=()

[handler_debugConsoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
# format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
format={asctime} - {name} - {levelname:8s} - {message}
style={
datefmt=%m/%d %H:%M:%S

