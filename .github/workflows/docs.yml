name: Docs

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# quarto publish gh-pages pushes the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # quarto publish needs full history to update the gh-pages branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # Notebooks are executed during the render (see the execute: block in
      # docs/_quarto.yml), so the notebooks extra is required in addition to docs.
      - run: uv sync --extra docs --extra notebooks
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # docs/_extensions is gitignored, so the interlinks filter has to be
      # fetched before rendering.
      - name: Install Quarto extensions
        working-directory: docs
        run: quarto add machow/quartodoc --no-prompt
      - name: Render and publish
        working-directory: docs
        run: |
          uv run quarto render
          uv run quarto publish gh-pages --no-render --no-prompt --no-browser
