
# This workflow will build history-matching documentation triggered on a push to the repository or creation of a pull request.
# Integrated with AZURE Static Site and BLOB Storage 
# It treats failures as warnings so that it builds as much of the documentation as it can for preview.
# TRIGGERED FROM A PR: It pushes the resulting link to the PR itself. TODO: update github token with a service account one.
name: history-matching Documents Preview - Azure Staging

on: [push, pull_request]
     
jobs:
  history-matching-Docs-Preview:
    env:
      SUBFOLDER_NAME: 'dist/docs'
      BLOB_ENDPOINT: 'https://idmdocsstaging.z5.web.core.windows.net'
      REPO_IDENTIFIER: 'idm/${{github.repository}}'   
      BLOB_CONTAINER_NAME: '$web'
      INDEX_HTML: 'index.html'
      
    runs-on: ubuntu-latest
    steps:
    - name: Repo Checkout
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}

    # Environment Setup
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
          python-version: 3.9

    - name: Install history-matching requirements
      run: |
        python3 -m pip install --progress-bar=off -r ci/requirements.txt
        pip list --format=freeze

    # Documents building - treat failures as warnings      
    - name: Build docs - html - no break
      id: build-docs
      working-directory: 'docs'
      run: |
        tox -e docspreview
    
    # Generates Unique folder name
    - name: Get current date to generate partial url link
      id: date
      run: |
        echo "RUN_DATE=$(TZ='America/Los_Angeles' date +'%B %d %H:%M:%S')" >> $GITHUB_ENV
        echo "THIS_RUN=$(TZ='America/Los_Angeles' date +'%B%d-%H%M%S')" >> $GITHUB_ENV
        
    # GENERATE LINKS        
    - name: Generate Link
      run: |
        echo "LINK_URL=${BLOB_ENDPOINT}/${REPO_IDENTIFIER}/${{env.THIS_RUN}}/${SUBFOLDER_NAME}/${INDEX_HTML}" >> $GITHUB_ENV

    - name: YOUR LINK
      run: |
        echo "${{ env.LINK_URL }}"

    # AZURE LOGIN:
    - name: Azure login
      uses: azure/login@v1
      with:
          creds: ${{ secrets.BLOB_JSON_SERVICE_PRINCIPAL_CREDENTIALS }} 
          
    # AZURE UPLOAD:
    - name: Upload to blob storage under $web
      if: always()
      uses: azure/CLI@v1
      with:
        inlineScript: |
            az storage blob upload-batch -s ${SUBFOLDER_NAME} --account-name idmdocsstaging  --auth-mode key -d ${BLOB_CONTAINER_NAME}/${REPO_IDENTIFIER}/${{env.THIS_RUN}}/${SUBFOLDER_NAME}

            
    # AZURE PURGE CDN
    - name: Purge Azure CDN endpoint
      if: always()
      uses: azure/CLI@v1
      with:
          inlineScript: |
               az cdn endpoint purge --content-paths  "/*" --profile-name "idmdocs-cdn-webprofile" --name "idmdocs-cdn-webendpoint" --resource-group "IDMDocsPreviewGroup"
    
    # AZURE LOGOUT
    - name: Azure logout
      if: always()    
      run: |
            az logout
            
    # Updates PR
    - name: Updates PR
      if: always()
      uses: mshick/add-pr-comment@v1
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          message: |
            ${{ env.RUN_DATE }} - Run Id: ${{github.run_id}} **[->> Link to documents preview](${{ env.LINK_URL }})**
