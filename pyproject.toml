[build-system]
requires = [
    "setuptools>=30.3.0,<81",
]

[project]
name = "historymatching"
version = "2.0.0"
description = "A Python implementation of the Bayesian History Matching algorithm."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Daniel J. Klein", email = "Daniel.Klein@gatesfoundation.org"},
    {name = "Rafael C. Nunez"},
    {name = "Richard Barnes"},
    {name = "Christopher Lorton"},
    {name = "Cliff Kerr"},
]
keywords = [
    "Bayesian History Matching",
    "History Matching", 
    "Model Emulation",
    "Model Emulators",
    "Model Calibration",
    "Uncertainty Quantification"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX", 
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "setuptools>=30.3.0,<82",  # gpflow requires pkg_resources, removed in setuptools 82+
    "tensorflow>=2.18",
    "tf-keras",
    "gpflow>=2.5",  # 2.5+ stable API
    "bokeh>=3.0",
    "numexpr>=2.8,!=2.8.5", # until RE string issue gets fixed
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "chardet"]
mac = ["tensorflow-metal"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",  # for parallel testing
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
    "mkdocs-include-markdown-plugin>=6.0",
    "pymdown-extensions>=10.21.3",
]

[project.urls]
Documentation = "https://docs.idmod.org/projects/historymatching/"
Changelog = "https://docs.idmod.org/projects/historymatching/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/InstituteforDiseaseModeling/historymatching/issues"
Repository = "https://github.com/InstituteforDiseaseModeling/historymatching"

[tool.setuptools.packages.find]
include = ["historymatching*"]

[tool.pytest.ini_options]
norecursedirs = ["migrations"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",  # gpflow docstrings use unescaped '\' -> SyntaxWarning on py3.12+
    "ignore::UserWarning:gpflow",
    "ignore::UserWarning:historymatching",
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    # requests warns at import (via TensorFlow) when transitive urllib3/chardet
    # versions are newer than it officially supports.  It's a benign third-party
    # warning; match by message so we don't import RequestsDependencyWarning
    # (importing it re-triggers the warning under the "error" filter).
    "ignore:urllib3 .* doesn't match a supported version:Warning",
]
