[build-system]
requires = [
    "setuptools>=30.3.0,<81",
]

[project]
name = "history-matching"
version = "1.0.0"
description = "A Python implementation of the Bayesian History Matching algorithm."
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Daniel J. Klein", email = "Daniel.Klein@gatesfoundation.org"},
    {name = "Rafael C. Nunez"},
    {name = "Richard Barnes"},
    {name = "Christopher Lorton"},
]
keywords = [
    "Bayesian History Matching",
    "History Matching", 
    "Model Emulation",
    "Model Emulators",
    "Model Calibration",
    "Uncertainty Quantification"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX", 
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "statsmodels",
    "scipy",
    "scikit-learn",
    "pydoe2",
    "tensorflow>=2.18",
    "tf-keras",
    "gpflow",
    "bokeh",
    "numexpr!=2.8.5", # until RE string issue gets fixed
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "chardet"]
mac = ["tensorflow-metal"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",  # for parallel testing
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0", 
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "pre-commit>=3.0",
]

[project.urls]
Documentation = "https://docs.idmod.org/projects/history-matching/"
Changelog = "https://docs.idmod.org/projects/history-matching/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/InstituteforDiseaseModeling/history_matching/issues"
Repository = "https://github.com/InstituteforDiseaseModeling/history_matching"

[project.scripts]
history-matching = "history_matching.cli:main"

[tool.ruff]
extend-exclude = ["static", "ci/templates", "examples"]
line-length = 200
src = ["history_matching", "tests"]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "RUF001", # ruff-specific rules ambiguous-unicode-character-string
    "S101", # flake8-bandit assert
    "S308", # flake8-bandit suspicious-mark-safe-usage
    "S603", # `subprocess` without `shell=True`
    "S607", # starting a process with a partial path
]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "EXE", # flake8-executable
    "F", # pyflakes
    "I", # isort
    "INT", # flake8-gettext
    "PIE", # flake8-pie
    "PLC", # pylint convention
    "PLE", # pylint errors
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "S", # flake8-bandit
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"ci/*" = ["S"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.black]
line-length = 200
target-version = ["py39"]
skip-string-normalization = true
ignore = ".venv"
