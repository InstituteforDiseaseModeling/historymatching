site_name: History Matching
site_description: Bayesian History Matching for model calibration and uncertainty quantification
site_url: https://institutefordiseasemodeling.github.io/history_matching
repo_name: InstituteforDiseaseModeling/history_matching
repo_url: https://github.com/InstituteforDiseaseModeling/history_matching

copyright: Copyright &copy; 2025 Gates Foundation. All rights reserved.

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/idm-logo-transparent.png
  favicon: assets/favicon.ico
  features:
    - navigation.footer
    - content.code.copy
    - navigation.indexes
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: white
      accent: light blue
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: black
      accent: light blue

nav:
  - Home: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Tutorials:
      - Tutorials index: tutorials.md
      - Quick start: tutorials/01_basic_sir_model.ipynb
      - Interactive workflow: tutorials/01_basic_sir_oop_demo.ipynb
      - Manual control: tutorials/01_manual_history_matching_oop.ipynb
      - Advanced configuration: tutorials/02_advanced_configuration.ipynb
      - Automatic workflow: tutorials/03_automatic_workflow.ipynb
      - Emulator showcase: tutorials/04_emulator_showcase.ipynb
  - Usage guide: usage.md
  - API reference: api.md
  - Contributing: contributing.md
  - What's new: whatsnew.md

docs_dir: docs

markdown_extensions:
  - toc:
      toc_depth: 3
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - footnotes
  - pymdownx.highlight:
      default_lang: python
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - customization/css/extra.css

plugins:
  - mkdocs-jupyter:
      include: ["**/*.ipynb"]
      execute: false
      allow_errors: true
      include_source: true
      kernel_name: python3
  - search
  - autorefs
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            merge_init_into_class: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_toc_entry: true
            show_object_full_path: true

extra:
  generator: false
  footer_links:
    - text: "Privacy and Cookies Notice"
      href: "https://www.gatesfoundation.org/Privacy-and-Cookies-Notice"
    - text: "Terms of Use"
      href: "https://www.gatesfoundation.org/Terms-of-Use"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/InstituteforDiseaseModeling/history_matching
    - icon: fontawesome/regular/envelope
      link: mailto:idm@gatesfoundation.org
    - icon: octicons/globe-24
      link: https://idmod.org
